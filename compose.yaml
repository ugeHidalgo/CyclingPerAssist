services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=/var/run/postgresql;Username=postgres;Database=cycling_performance_assistant
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: cycling_performance_assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 1m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h /var/run/postgresql -U postgres -d postgres && curl -fsS http://127.0.0.1:8080/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
